                <circle cx="165" cy="70" r="14" fill="#ffffff"/><circle cx="165" cy="70" r="10" fill="#0a0a0a"/><circle cx="165" cy="70" r="3" fill="#ffffff"/><path d="M161 63 L169 77" stroke="#0a0a0a" stroke-width="1.5"/>
                <text x="184" y="82" font-family="'Montserrat', sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="0">z</text>

        </div>
        <button id="menu-btn" class="md:hidden text-white text-2xl focus:outline-none"><i class="fa-solid fa-bars"></i></button>
    </nav>

    <div id="mobile-menu" class="hidden fixed inset-0 z-40 bg-black flex flex-col justify-center items-center space-y-8 text-xl font-bold tracking-widest">
        <a href="/" class="hover:text-white">HOME</a>
        <a href="/about/" class="hover:text-white">ABOUT</a>
        <a href="/mixes/" class="hover:text-white">MIXES</a>

    <section class="py-32 px-6 max-w-4xl mx-auto flex-grow">
        <div class="text-center space-y-4 mb-12">
            <h2 class="text-4xl md:text-6xl font-black tracking-tight text-white">SCHEDULE A PERFORMANCE</h2>
            <p class="text-neutral-500 text-sm">Submit your routing structural requests directly to his management panel.</p>
        </div>

        <form action="https://formspree.io/f/bookdjramoz@gmail.com" method="POST" class="space-y-6 bg-neutral-950 p-8 md:p-12 rounded-3xl border border-neutral-900 shadow-2xl">
            <input type="hidden" name="_subject" value="NEW BOOKING REQUEST: Deejayramoz Website">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-neutral-400">Your Full Name</label>
                    <input type="text" name="name" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-500 transition-colors">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-neutral-400">Email Address</label>
                    <input type="email" name="_replyto" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-500 transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-neutral-400">Phone Number</label>
                    <input type="tel" name="phone" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-500 transition-colors">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-neutral-400">Event Date</label>
                    <input type="date" name="date" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-500 transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-neutral-400">Event Configuration</label>
                    <select name="event_type" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-500 transition-colors">
                        <option value="Club Night">Club Night / Lounge Residency</option>
                        <option value="Concert">Concert / Outdoor Festival</option>
                        <option value="Corporate">Corporate Event / Launch</option>
                        <option value="Private">Private Event / Special Function</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-neutral-400">Event Venue Location</label>
                    <input type="text" name="location" placeholder="e.g., Nyali, Mombasa" required class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-500 transition-colors">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-wider text-neutral-400">Additional Specifications</label>
                <textarea name="message" rows="4" placeholder="Sound specifications, performance runtime, setup requirements..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-500 transition-colors resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-white text-black font-bold tracking-widest py-4 rounded-xl hover:bg-neutral-200 transition-colors">
                TRANSMIT BOOKING REQUEST
            </button>
        </form>
    </section>

    <footer class="bg-black py-10 px-6 border-t border-neutral-900 text-center space-y-4">
        <div class="flex justify-center space-x-6 text-neutral-500 text-lg">

            <a href="tel:+254701550953" class="hover:text-white"><i class="fa-solid fa-phone"></i></a>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
